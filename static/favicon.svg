<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
    <style>
        :root {
            color-scheme: light dark;
        }

        @font-face {
            font-family: "Iosevka Custom Subset";
            src: url("data:font/ttf;base64,");
        }

        @media (prefers-color-scheme: dark) {
            .bg { fill: #1e1e2e; }
            .fg { fill: #cdd6f4; }
        }

        @media (prefers-color-scheme: light) {
            .bg { fill: #eff1f5; }
            .fg { fill: #4c4f69; }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .cursor {
            animation: blink 1s step-end infinite;
        }
    </style>
    <rect class="bg" width="180" height="180" />
    <text
        class="fg"
        x="50%"
        y="50%"
        font-family="Iosevka Custom Subset, Iosevka Custom, Roboto Mono, monospace"
        font-size="120"
        text-anchor="middle"
        dominant-baseline="central"
    >t<tspan class="cursor">_</tspan></text>
</svg>
